# Phân loại kỹ năng ngành IT/Software — TDD §9.2, §8.2 lớp 1.
#
# Vì sao là DỮ LIỆU chứ không phải code: danh sách này thay đổi liên tục (mỗi
# framework mới là một dòng), còn logic khớp thì không. Người không biết lập
# trình cũng bổ sung được.
#
# Vì sao cần: JD viết "ReactJS", CV viết "React.js", ATS viết "React" — cùng
# một thứ. Không chuẩn hoá thì lớp keyword báo "thiếu React" trên một CV đầy
# React, và toàn bộ phân tích phía sau sai theo.
#
# `aliases` phải có CẢ tiếng Việt lẫn tiếng Anh, và cả dạng không dấu: người
# dùng Việt gõ không dấu rất nhiều (TDD §9.2).
#
# Quy ước:
#   canonical  khoá nội bộ, snake_case, KHÔNG hiển thị cho user
#   display    chuỗi hiển thị, đúng cách viết hoa của cộng đồng
#   kind       language | framework | database | tool | platform | practice | soft
#   parent     canonical của kỹ năng bao hàm (react → javascript)
#   weight     độ quan trọng khi tính điểm; mặc định 1.0

version: 1
industry: it_software

