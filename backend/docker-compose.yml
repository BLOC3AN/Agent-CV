# HR-Agent — hạ tầng cục bộ (TDD §12.1)
#
# Cổng đã tránh xung đột với dịch vụ sẵn có trên máy dev:
#   mqtt_broker :1883 · dozzle :5555
# → Postgres ra 5433, Redis ra 6380.
#
# Model server (100.68.50.41) KHÔNG nằm ở đây — là dependency ngoài, chỉ đọc.

name: hr-agent

x-env: &env
  DATABASE_URL: postgres://postgres:${PG_PASSWORD:-hragent_dev}@postgres:5432/hragent
  REDIS_URL: redis://redis:6379
  MODEL_HOST: ${MODEL_HOST:-http://100.68.50.41}
  PDFKIT_URL: http://pdfkit:8000
  HR_CONFIG_PATH: /app/config.yml
  # Web ghi file upload, worker đọc — cùng đường dẫn, cùng volume `uploads`.
  STORAGE_ROOT: /app/var/storage
  NODE_ENV: ${NODE_ENV:-development}

services:
  backend:
    env_file:
      - ../.env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-backend
    restart: unless-stopped
    environment:
      BACKEND_ADDR: :8080
      DATABASE_URL: postgres://postgres:${PG_PASSWORD:-hragent_dev}@postgres:5432/hragent
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /app/var/storage
      PDFKIT_URL: http://pdfkit:8000
      HR_CONFIG_PATH: /app/config.yml
    ports:
      - '8080:8080'
    volumes:
      - uploads:/app/var/storage
      - ../config.yml:/app/config.yml:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: pgvector/pgvector:pg16
    container_name: hr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hragent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-hragent_dev}
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hragent']
      interval: 10s
      timeout: 5s
      retries: 10
    # Máy dev còn ~25GB khả dụng — chặn trần để không ảnh hưởng việc khác
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: hr-redis
    restart: unless-stopped
    # maxmemory-policy PHẢI là noeviction: Redis chỉ là cache/chat memory;
    # trạng thái job bền vững nằm trong PostgreSQL.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '512mb', '--maxmemory-policy', 'noeviction']
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  # Trích text + toạ độ từ PDF có text layer (TDD §8.1 bước [1]).
  # Chỉ service Python duy nhất — pdfplumber/PyMuPDF vượt trội thư viện JS
  # về layout extraction.
  pdfkit:
    build:
      context: ./legacy-node-services/pdfkit
    container_name: hr-pdfkit
    restart: unless-stopped
    ports:
      - '8100:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    build:
      context: ..
      dockerfile: frontend/apps/web-spa/Dockerfile
    container_name: hr-web
    restart: unless-stopped
    environment:
      <<: *env
      # Dev default giúp `docker compose` quản lý từng service; production
      # phải ghi đè bằng AUTH_SECRET thật trong .env/secret manager.
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me}
      BACKEND_URL: http://backend:8080
    ports:
      - '3000:3000'
    volumes:
      - uploads:/app/var/storage
    depends_on:
      backend: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Rollback target: giữ Next sẵn ở cổng 3001 trong cửa sổ theo dõi cutover.
  # Không nhận traffic production mặc định; bật bằng `--profile rollback`.
  web-next-rollback:
    profiles: ['rollback']
    build:
      context: ..
      dockerfile: frontend/apps/web/Dockerfile
    container_name: hr-web-next-rollback
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GO_BACKEND_URL: http://backend:8080
    ports:
      - '3001:3000'
    depends_on:
      backend: { condition: service_started }

  # Go worker: parse CV, match analysis và retention
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: hr-worker
    restart: unless-stopped
    environment:
      <<: *env
      DATABASE_URL: postgres://postgres:${PG_PASSWORD:-hragent_dev}@postgres:5432/hragent
      PDFKIT_URL: http://pdfkit:8000
    volumes:
      - uploads:/app/var/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      pdfkit: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  pgdata:
  redisdata:
  # File upload — web GHI, worker ĐỌC. Không dùng chung thì worker báo
  # FILE_MISSING với mọi file, và log không chỉ ra nguyên nhân.
  uploads:
