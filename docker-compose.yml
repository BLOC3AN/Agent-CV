# HR-Agent — hạ tầng cục bộ (TDD §12.1)
#
# Cổng đã tránh xung đột với dịch vụ sẵn có trên máy dev:
#   mqtt_broker :1883 · dozzle :5555
# → Postgres ra 5433, Redis ra 6380.
#
# Model server (100.68.50.41) KHÔNG nằm ở đây — là dependency ngoài, chỉ đọc.

name: hr-agent

x-env: &env
  DATABASE_URL: postgres://postgres:${PG_PASSWORD:-hragent_dev}@postgres:5432/hragent
  REDIS_URL: redis://redis:6379
  MODEL_HOST: ${MODEL_HOST:-http://100.68.50.41}
  PDFKIT_URL: http://pdfkit:8000
  NODE_ENV: ${NODE_ENV:-development}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hragent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-hragent_dev}
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hragent']
      interval: 10s
      timeout: 5s
      retries: 10
    # Máy dev còn ~25GB khả dụng — chặn trần để không ảnh hưởng việc khác
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: hr-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '512mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  # Trích text + toạ độ từ PDF có text layer (TDD §8.1 bước [1]).
  # Chỉ service Python duy nhất — pdfplumber/PyMuPDF vượt trội thư viện JS
  # về layout extraction.
  pdfkit:
    build:
      context: ./services/pdfkit
    container_name: hr-pdfkit
    restart: unless-stopped
    ports:
      - '8100:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    profiles: ['full']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hr-web
    restart: unless-stopped
    environment:
      <<: *env
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET chưa đặt trong .env}
    ports:
      - '3000:3000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: ['full']

  # BullMQ: parse CV, export PDF (Playwright), embed
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: hr-worker
    restart: unless-stopped
    environment:
      <<: *env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 2G
    profiles: ['full']

volumes:
  pgdata:
  redisdata:
